[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkpinn"
description = "Runge-Kutta physics-informed networks chained to themselves to give a full track, scored in one standard way"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "pyyaml"]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "rkpinn.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
