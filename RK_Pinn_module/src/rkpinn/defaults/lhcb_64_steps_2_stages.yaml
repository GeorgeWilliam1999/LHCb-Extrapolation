# The default configuration for the LHCb crossing. Agreed with George on
# 2026-10-09: the five choices in the worklog of the to-do "Build the package
# that trains and scores the self-chained networks".
#
# What it is: one network of 64 steps of 80.9 mm and 2 Gauss-Legendre stages,
# emitting the stage states, its end state summed from the stages, trained by
# the pooled loss over the stages. It is, setting for setting, run A of the
# pilot (run key bddea42ea1ef), which reached 8.97 micrometres at the endpoint
# on the test split; the frozen network of the same size reached 145.7.
#
# What scores it, not a setting of this file: the sixth-order reference at a
# step of 0.1 mm (integrators/runge_kutta_sixth_order.py, REFERENCE_STEP_LENGTH_MM),
# which built the track set 12a8d35c3165; and the exact collocation scheme of
# the same 64 steps and 2 stages (integrators/exact_collocation.py), whose
# states for the test split are in the store and give the ceiling, 0.147
# micrometres.
#
# An experiment copies this file and changes what it asks about. It does not
# edit this file. A change here changes the run key below, and the gate
# tests/test_default_configuration.py says so.
equation_of_motion: {system: lhcb, field_map: v8r1_up}
tracks: {key: 12a8d35c3165}
steps: {number_of_steps: 64, number_of_stages: 2}
network:
  kind: stage_network
  output_form: direct_states
  width: 128
  depth: 2
  activation: tanh
  end_state: summed_from_the_stages
  scale_of_inputs: spread_of_first_round_states
  scale_of_outputs: spread_of_first_round_states
loss: {name: pooled, terms: stages}
target: {name: no_target}
training:
  protocol: {name: rounds_on_own_predictions, states_per_round: 32000}
  restarts_per_round: 25
  end_a_round_when_stalled: null
  optimiser:
    name: lbfgs_restarts
    iterations_per_restart: 200
    history: 120
    tolerance_of_the_gradient: 1.0e-13
    tolerance_of_the_change: 1.0e-16
    line_search: strong_wolfe
    renew_scale_when_loss_falls_to: 0.1
  stopping_rule:
    name: validation_plateau
    quantity: validation_endpoint_error_larger_of_x_and_y_median_micrometres
    window_in_rounds: 10
    tolerance: 0.05
    rounds_held: 3
  rounds_at_most: 60
seed: 0
