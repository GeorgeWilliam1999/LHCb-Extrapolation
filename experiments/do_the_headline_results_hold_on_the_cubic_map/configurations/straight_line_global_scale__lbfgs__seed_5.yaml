# Headline network on the cubic map: straight line global scale, lbfgs, 64 steps x 2 stages, seed 5.
# Copied from does_the_straight_line_form_restore_the_old_accuracy/configurations/64_steps_2_stages_pooled_global_scale.yaml and changed only in tracks.key (5558be31abeb),
# equation_of_motion.field_map (v8r1_up_cubic) and the seed. See ../README.md.
equation_of_motion:
  system: lhcb
  field_map: v8r1_up_cubic
tracks:
  key: 5558be31abeb
steps:
  number_of_steps: 64
  number_of_stages: 2
network:
  kind: stage_network
  output_form: straight_line_plus_scaled_correction
  width: 128
  depth: 2
  activation: tanh
  end_state: summed_from_the_stages
  scale_of_inputs: spread_of_first_round_states
  scale_of_outputs: median_of_per_track_scale_over_first_round_states
loss:
  name: pooled
  terms: stages
target:
  name: no_target
training:
  protocol:
    name: rounds_on_own_predictions
    states_per_round: 32000
  restarts_per_round: 25
  end_a_round_when_stalled: null
  optimiser:
    name: lbfgs_restarts
    iterations_per_restart: 200
    history: 120
    tolerance_of_the_gradient: 1.0e-13
    tolerance_of_the_change: 1.0e-16
    line_search: strong_wolfe
    renew_scale_when_loss_falls_to: 0.1
  stopping_rule:
    name: validation_plateau
    quantity: validation_endpoint_error_larger_of_x_and_y_median_micrometres
    window_in_rounds: 10
    tolerance: 0.05
    rounds_held: 3
  rounds_at_most: 80
seed: 5
