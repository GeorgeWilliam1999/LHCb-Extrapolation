# Steps and stages on the cubic map: straight line per track scale, 128 steps x 2 stages, seed 1.
# Copied from does_a_better_optimiser_improve_the_endpoint/configurations/straight_line_per_track_scale__self_scaled_broyden__seed_1.yaml and changed only in tracks.key (5558be31abeb),
# equation_of_motion.field_map (v8r1_up_cubic), the seed and the steps and stages. See ../README.md.
equation_of_motion:
  system: lhcb
  field_map: v8r1_up_cubic
tracks:
  key: 5558be31abeb
steps:
  number_of_steps: 128
  number_of_stages: 2
network:
  kind: stage_network
  output_form: straight_line_plus_scaled_correction
  width: 128
  depth: 2
  activation: tanh
  end_state: summed_from_the_stages
  scale_of_inputs: spread_of_first_round_states
  scale_of_outputs: per_track
loss:
  name: pooled
  terms: stages
target:
  name: no_target
training:
  protocol:
    name: rounds_on_own_predictions
    states_per_round: 32000
  restarts_per_round: 25
  end_a_round_when_stalled: null
  optimiser:
    name: self_scaled_broyden_restarts
    iterations_per_restart: 200
    tolerance_of_the_gradient: 1.0e-13
    tolerance_of_the_change: 1.0e-16
    renew_scale_when_loss_falls_to: 0.1
    threads_for_the_matrix: 4
  stopping_rule:
    name: validation_plateau
    quantity: validation_endpoint_error_larger_of_x_and_y_median_micrometres
    window_in_rounds: 10
    tolerance: 0.05
    rounds_held: 3
  rounds_at_most: 80
seed: 1
