# Run P1: the path network, width 256, supervised path loss, L-BFGS.
# Planned 2026-11-03; not agreed. The components path_network, reference_path
# and supervised_path do not exist yet (README, "What is added to the package").
equation_of_motion: {system: lhcb, field_map: v8r1_up}
tracks: {key: 12a8d35c3165}
steps: {number_of_steps: 64, number_of_stages: 2}
network:
  kind: path_network
  output_form: straight_line_per_track
  width: 256
  depth: 2
  activation: tanh
  scale_of_inputs: spread_of_first_round_states
  scale_of_outputs: spread_of_first_round_states
loss: {name: supervised_path, divisor: spread_of_target_states, uncertainty: none}
target: {name: reference_path}
training:
  protocol: {name: start_states_of_the_tracks, states_per_round: 11567}
  restarts_per_round: 25
  end_a_round_when_stalled: null
  optimiser:
    name: lbfgs_restarts
    iterations_per_restart: 200
    history: 120
    tolerance_of_the_gradient: 1.0e-13
    tolerance_of_the_change: 1.0e-16
    line_search: strong_wolfe
    renew_scale_when_loss_falls_to: 0.1
  stopping_rule:
    name: validation_plateau
    quantity: validation_endpoint_error_larger_of_x_and_y_median_micrometres
    window_in_rounds: 10
    tolerance: 0.05
    rounds_held: 3
  rounds_at_most: 200
seed: 1
