# 64 steps of 80.903 mm, 2 stages, cost weighted 3 to 8 gev. Copied from the LHCb default
# (rkpinn/defaults/lhcb_64_steps_2_stages.yaml) and changed only in the
# cell, the loss, the seed (1) and the cap (80 rounds). Agreed with George
# on 2026-10-12. See ../README.md.
equation_of_motion:
  system: lhcb
  field_map: v8r1_up
tracks:
  key: 12a8d35c3165
steps:
  number_of_steps: 64
  number_of_stages: 2
network:
  kind: stage_network
  output_form: direct_states
  width: 128
  depth: 2
  activation: tanh
  end_state: summed_from_the_stages
  scale_of_inputs: spread_of_first_round_states
  scale_of_outputs: spread_of_first_round_states
loss:
  name: cost_weighted
  terms: stages
  roll_off: 0.6931471805599453
  floor: 0.05
  clamp: 5.0
  samples_of_the_field_integral: 1024
  lever_arm_is_on: true
  track_bend_is_on: true
  momentum_window_is_on: true
  reference_bend_mm: median_of_first_round_states
  momentum_window_gev:
  - 3.0
  - 8.0
target:
  name: no_target
training:
  protocol:
    name: rounds_on_own_predictions
    states_per_round: 32000
  restarts_per_round: 25
  end_a_round_when_stalled: null
  optimiser:
    name: lbfgs_restarts
    iterations_per_restart: 200
    history: 120
    tolerance_of_the_gradient: 1.0e-13
    tolerance_of_the_change: 1.0e-16
    line_search: strong_wolfe
    renew_scale_when_loss_falls_to: 0.1
  stopping_rule:
    name: validation_plateau
    quantity: validation_endpoint_error_larger_of_x_and_y_median_micrometres
    window_in_rounds: 10
    tolerance: 0.05
    rounds_held: 3
  rounds_at_most: 80
seed: 1
